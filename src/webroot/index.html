<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>PingPimp</title>
  <link rel="icon" href="data:," />
  <script>
    // 1) BOOTSTRAP — WAJIB: set atribut SEBELUM CSS dimuat (anti FOUC)
    (function () {
      var root = document.documentElement;
      var monet = 'on', nav = 'bar';
      try {
        monet = localStorage.getItem('pingpimp_monet') === 'off' ? 'off' : 'on';
        nav = localStorage.getItem('pingpimp_nav') === 'floating' ? 'floating' : 'bar';
      } catch (e) {}
      root.setAttribute('data-monet', monet);
      root.setAttribute('data-nav', nav);
    })();
  </script>
  <style>
    /* 3) OVERLAY BOOT — inline & mandiri: tetap tampil benar walau
       pingpimp.css / modul aplikasi gagal dimuat. Dua state:
       loading (spinner) dan failed (kartu error + tombol reload).
       Warna mengikuti palet M3 dasar gelap/terang aplikasi. */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: #141218; color: #e6e0e9;
      font-family: Roboto, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 24px;
      transition: opacity .3s ease;
    }
    .pp-boot-spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(202, 196, 208, .25);
      border-top-color: #d0bcff;
      animation: pp-boot-spin .8s linear infinite;
    }
    .pp-boot-label { font-size: 14px; font-weight: 500; opacity: .8; }
    .pp-boot-error {
      display: flex; flex-direction: column; gap: 10px;
      width: min(320px, calc(100vw - 48px));
      padding: 20px; border-radius: 24px; background: #211f26;
    }
    .pp-boot-error-title { font-size: 16px; font-weight: 600; color: #e6e0e9; }
    .pp-boot-error-detail { font-size: 12px; line-height: 1.45; color: #cac4d0; word-break: break-word; }
    .pp-boot-retry {
      margin-top: 4px; align-self: center;
      border: 0; border-radius: 100px; padding: 10px 24px;
      background: #d0bcff; color: #381e72;
      font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer;
    }
    .pp-boot-retry:active { transform: scale(.97); }
    .pp-boot-retry:focus-visible { outline: 2px solid #d0bcff; outline-offset: 3px; }
    @keyframes pp-boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: light) {
      #loading-overlay { background: #f7f2fa; color: #1d1b20; }
      .pp-boot-spinner { border-color: rgba(73, 69, 79, .25); border-top-color: #6750a4; }
      .pp-boot-error { background: #f3edf7; }
      .pp-boot-error-title { color: #1d1b20; }
      .pp-boot-error-detail { color: #49454f; }
      .pp-boot-retry { background: #6750a4; color: #ffffff; }
      .pp-boot-retry:focus-visible { outline-color: #6750a4; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pp-boot-spinner { animation: none; }
      .pp-boot-retry:active { transform: none; }
    }
  </style>
  <link rel="stylesheet" href="assets/pingpimp.css">
</head>
<body>
  <!-- Vue 3 + bridge KernelSU kini digabung inline di dalam assets/pingpimp.js
       (single-file module) — tidak ada lagi request terpisah saat boot -->

  <!-- Titik mount aplikasi Vue -->
  <div id="app">
    <div class="boot-fallback">Loading...</div>
  </div>

  <!-- Overlay boot: menunggu sinyal "JS siap" dari modul aplikasi -->
  <div id="loading-overlay" role="status" aria-live="polite">
    <div class="pp-boot-spinner" aria-hidden="true"></div>
    <div class="pp-boot-label">Loading...</div>
  </div>

  <script>
    // 2) BOOT CONTROLLER — pemilik tunggal siklus hidup overlay:
    //    - ready(): dipanggil modul aplikasi setelah Vue mounted +
    //      init fase-1 (settings persisten + bahasa) selesai,
    //      overlay fade out.
    //    - fail(title, detail): kartu error + tombol reload.
    //    - Watchdog 12 detik: modul tidak kunjung siap (gagal load,
    //      bridge macet) → fallback terlihat, bukan layar mati.
    //    - window error (capture): error runtime pra-siap dan gagal
    //      load <script> langsung masuk state failed dengan pesan
    //      aslinya (memudahkan debug fork manager).
    (function () {
      var overlay = document.getElementById('loading-overlay');
      var WATCHDOG_MS = 12000;
      var state = 'loading';
      var watchdog = null;

      function clearWatchdog() {
        if (watchdog !== null) { clearTimeout(watchdog); watchdog = null; }
      }

      function fadeOut() {
        if (!overlay || !overlay.parentNode) return;
        overlay.style.opacity = '0';
        setTimeout(function () {
          if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 350);
      }

      function ready() {
        if (state !== 'loading') return;
        state = 'ready';
        clearWatchdog();
        fadeOut();
      }

      function fail(title, detail) {
        if (state !== 'loading') return;
        state = 'failed';
        clearWatchdog();
        if (!overlay) return;
        overlay.innerHTML = '';
        overlay.setAttribute('role', 'alert');
        var card = document.createElement('div');
        card.className = 'pp-boot-error';
        var h = document.createElement('div');
        h.className = 'pp-boot-error-title';
        h.textContent = title || 'Failed to load WebUI';
        card.appendChild(h);
        if (detail) {
          var d = document.createElement('div');
          d.className = 'pp-boot-error-detail';
          d.textContent = detail;
          card.appendChild(d);
        }
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pp-boot-retry';
        btn.textContent = 'Reload WebUI';
        btn.addEventListener('click', function () { location.reload(); });
        card.appendChild(btn);
        overlay.appendChild(card);
      }

      watchdog = setTimeout(function () {
        fail('Failed to load WebUI',
             'The app did not become ready in time. The root manager bridge may be unavailable, or an unexpected error occurred.');
      }, WATCHDOG_MS);

      window.addEventListener('error', function (e) {
        if (state !== 'loading') return;
        // Error subresource LINK bersifat non-fatal (mis. @import
        // mui.kernelsu.org/insets+colors.css yang hanya tersedia di dalam
        // manager, atau favicon 404 di browser biasa) — tidak boleh
        // mematikan boot. Fatal tetap: error runtime JS & gagal load
        // <script>; watchdog 12 detik tetap menjaga app mati total.
        if (e && !e.message && e.target && e.target !== window &&
            String(e.target.tagName).toUpperCase() === 'LINK') { return; }
        var msg = '';
        if (e && typeof e.message === 'string' && e.message) msg = e.message;
        else if (e && e.target && e.target !== window && e.target.tagName) {
          msg = 'Failed to load resource: ' + String(e.target.tagName).toLowerCase() +
                (e.target.src ? ' (' + e.target.src + ')' : '');
        } else {
          msg = 'Unknown script error';
        }
        fail('Failed to load WebUI', msg);
      }, true);

      window.__PP_BOOT__ = { ready: ready, fail: fail, state: function () { return state; } };
    })();
  </script>
  <script type="module" src="assets/pingpimp.js"></script>
</body>
</html>
